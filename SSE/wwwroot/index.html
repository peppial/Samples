<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Server-Sent Events</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      padding: 2rem;
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      max-width: 52rem;
    }
    h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
    p.lede { margin: 0 0 1.5rem; opacity: .7; }
    .controls { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: 1rem; }
    button {
      font: inherit; padding: .4rem .8rem; border-radius: .4rem;
      border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer;
    }
    button[aria-pressed="true"] { background: currentColor; }
    button[aria-pressed="true"] span { color: Canvas; }
    .status { margin-left: auto; font-variant: small-caps; letter-spacing: .04em; }
    .status[data-state="open"] { color: #2e7d32; }
    .status[data-state="connecting"] { color: #ef6c00; }
    .status[data-state="closed"] { color: #c62828; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid rgb(128 128 128 / .25); }
    th { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; opacity: .6; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr.replayed td { opacity: .55; font-style: italic; }
    code { background: rgb(128 128 128 / .15); padding: .1rem .3rem; border-radius: .25rem; }
  </style>
</head>
<body>
  <h1>Server-Sent Events in ASP.NET Core</h1>
  <p class="lede">
    A background service publishes an order every 2s. Pick a stream, then stop and
    restart the server &mdash; <code>EventSource</code> reconnects on its own, and the
    replay endpoint sends back what you missed via <code>Last-Event-ID</code>.
  </p>

  <div class="controls">
    <button type="button" data-url="/orders/realtime"><span>plain</span></button>
    <button type="button" data-url="/orders/realtime/with-replays"><span>with replays</span></button>
    <button type="button" data-url="/orders/realtime/mine?customerId=alice"><span>alice only</span></button>
    <span class="status" id="status" data-state="closed">closed</span>
  </div>

  <table>
    <thead>
      <tr><th>id</th><th>order</th><th>customer</th><th class="num">amount</th><th>placed</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    const rows = document.getElementById('rows');
    const status = document.getElementById('status');
    const buttons = [...document.querySelectorAll('button[data-url]')];

    let eventSource = null;
    let reconnected = false;
    let replayUntil = 0;

    function setStatus(state) {
      status.dataset.state = state;
      status.textContent = state;
    }

    function connect(url) {
      eventSource?.close();
      rows.replaceChildren();
      reconnected = false;
      replayUntil = 0;

      buttons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.url === url)));
      setStatus('connecting');

      eventSource = new EventSource(url);

      eventSource.onopen = () => {
        setStatus('open');
        // Frames arriving right after a reconnect are the ones the server
        // replayed from Last-Event-ID. Flag them for half a second.
        if (reconnected) {
          replayUntil = performance.now() + 500;
          reconnected = false;
        }
      };

      eventSource.addEventListener('orders', (event) => {
        const order = JSON.parse(event.data);
        const id = event.lastEventId;
        const replayed = performance.now() < replayUntil;

        const row = document.createElement('tr');
        if (replayed) row.className = 'replayed';
        row.innerHTML = `
          <td>${id || '&mdash;'}</td>
          <td>${order.orderId}</td>
          <td>${order.customerId}</td>
          <td class="num">${order.amount.toFixed(2)}</td>
          <td>${new Date(order.placedAt).toLocaleTimeString()}</td>`;
        rows.prepend(row);

        while (rows.children.length > 100) rows.lastElementChild.remove();
      });

      eventSource.onerror = () => {
        const connecting = eventSource.readyState === EventSource.CONNECTING;
        reconnected = reconnected || connecting;
        setStatus(connecting ? 'connecting' : 'closed');
      };
    }

    buttons.forEach(b => b.addEventListener('click', () => connect(b.dataset.url)));
    connect(buttons[1].dataset.url);
  </script>
</body>
</html>
